[project]
name = "structure_tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BrunoCuevas", email = "brunocuevaszuviria@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.5.0",
    "esm>=3.4.1.post1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "torch>=2.11.0,<2.12.0",
    "transformers>=4.57.6,<5.0.0",
    "zensical>=0.0.72",
]

[project.scripts]
structure_tools = "structure_tools:main"
esm2 = "structure_tools.esmfold:cli"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

# Library default: plain PyPI torch so path/git installs work on macOS (MPS/CPU)
# and Linux. Do NOT put a CUDA index in tool.uv.sources here — that metadata
# leaks into consumer projects and breaks Darwin installs.
#
# For H200 / CUDA 12.8 deploys, use the Dockerfile (sets UV_TORCH_BACKEND=cu128)
# or in the consumer/GPU env:
#   UV_TORCH_BACKEND=cu128 uv sync

